name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, claude/vigilant-bardeen-phqwgr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Controlla i contenuti
        run: node tools/validate.js

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/*.js _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
