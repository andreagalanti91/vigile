<html lang="it">
<head>

<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mut:#6b6a64;--line:#e2e0d8;--acc:#1f4e79;--acc2:#e8eef5;--ok:#2e7d4f;--okb:#e6f3ec;--ko:#b03a2e;--kob:#f8e7e4;--warn:#9a6700;--warnb:#fff4d6}

header{background:var(--ink);color:#fff;padding:18px 20px 0}

nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#bdbbb3;padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}

main{max-width:920px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}

.stat{font-size:28px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}

.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}

table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mut);text-transform:uppercase}
td.ref{white-space:nowrap;font-weight:600;color:var(--acc);width:1%}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.sub button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}
.sub button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modlist .card{cursor:pointer;transition:border-color .15s}
.modlist .card:hover{border-color:var(--acc)}
.warn{background:var(--warnb);border:1px solid #f0d58a;border-radius:8px;padding:10px 13px;font-size:14px}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.concept{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0}
.concept b{display:block}
ol li,ul li{margin:5px 0}
.flash{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;cursor:pointer;padding:24px;user-select:none}
.flash.back{background:var(--acc2)}

.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ko{background:var(--kob);border-color:var(--ko)}
.expl{background:#f3f2ee;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}
textarea{width:100%;min-height:330px;font-family:Georgia,serif;font-size:15.5px;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.week{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.week.now{background:var(--acc2);margin:0 -10px;padding:10px;border-radius:8px;border:0}
.week .n{font-weight:700;min-width:62px}
.hidden{display:none}
.small{font-size:13px}
.en td:first-child{font-weight:600}
</style>
</head>

{
id:"edil", title:"Edilizia, urbanistica e ambiente", prio:"alta", level:"ottima conoscenza", weeks:"4",
intro:"Il bando chiede un'ottima conoscenza con particolare riferimento all'attività di vigilanza e sanzionatoria. Concentrati su titoli edilizi, vigilanza (art. 27), sanzioni (artt. 31–44) e rifiuti.",
norme:[
["D.P.R. 380/2001, art. 3","Definizioni degli interventi: manutenzione ordinaria e straordinaria, restauro e risanamento conservativo, ristrutturazione edilizia, nuova costruzione, ristrutturazione urbanistica."],
["Artt. 6 e 6-bis","Attività edilizia libera e CILA (comunicazione di inizio lavori asseverata)."],
["Art. 10","Interventi soggetti a permesso di costruire."],
["Artt. 22–23","SCIA e SCIA alternativa al permesso di costruire."],
["Art. 24","Agibilità (segnalazione certificata)."],
["Art. 27","Vigilanza sull'attività urbanistico-edilizia: il dirigente ordina la sospensione dei lavori; la polizia giudiziaria comunica le opere prive di titolo o di cartello."],
["Art. 31","Interventi senza permesso o in totale difformità: ingiunzione a demolire; se non si ottempera entro 90 giorni, acquisizione gratuita al patrimonio comunale."],
["Artt. 33–34-bis","Ristrutturazione senza titolo, parziale difformità, tolleranze costruttive."],
["Artt. 36–36-bis","Accertamento di conformità (sanatoria). Il D.L. 69/2024 (Salva-casa) ha introdotto l'art. 36-bis per le difformità parziali. ⚠ Verifica il testo vigente."],
["Art. 37","Interventi eseguiti senza SCIA o in difformità: sanzione pecuniaria."],
["Art. 44","Sanzioni penali: lett. a) inosservanza delle norme; lett. b) esecuzione senza permesso o in totale difformità, o prosecuzione nonostante la sospensione; lett. c) lottizzazione abusiva e interventi in zone vincolate."],
["L.R. Toscana 65/2014","Norme per il governo del territorio: in Toscana disciplina anche vigilanza e sanzioni edilizie. ⚠ Verifica gli articoli del titolo su vigilanza e sanzioni."],
["D.Lgs. 42/2004","Codice dei beni culturali e del paesaggio: autorizzazione paesaggistica (art. 146) e sanzioni (artt. 167, 181)."],
["D.Lgs. 152/2006, artt. 183–184","Definizioni di rifiuto e classificazione (urbani, speciali, pericolosi)."],
["Artt. 192, 255, 256, 256-bis","Divieto di abbandono, sanzioni per abbandono, gestione non autorizzata (reato), combustione illecita. ⚠ Le sanzioni per l'abbandono sono state inasprite nel 2025: verifica il testo vigente."],
["L. 447/1995 e art. 659 c.p.","Inquinamento acustico (legge quadro) e disturbo delle occupazioni o del riposo delle persone."]
],
concetti:[
["Scala dei titoli edilizi","Edilizia libera (nessun titolo, art. 6) → CILA (art. 6-bis) → SCIA (art. 22) → permesso di costruire (art. 10). Più l'intervento incide sul territorio, più il titolo è pesante."],
["Vigilanza (art. 27)","Spetta al dirigente o al responsabile del servizio, che può ordinare l'immediata sospensione dei lavori. Gli ufficiali e agenti di polizia giudiziaria, se nel cantiere non è esibito il titolo o non c'è il cartello, ne danno immediata comunicazione all'autorità giudiziaria, all'organo regionale competente e al dirigente."],
["Doppio binario","Lo stesso abuso può avere conseguenze amministrative (sospensione, demolizione, sanzioni pecuniarie) e penali (art. 44). Sono procedimenti distinti e paralleli."],
["Demolizione e acquisizione (art. 31)","Ingiunzione a demolire; se l'interessato non provvede entro 90 giorni, il bene e l'area sono acquisiti gratuitamente al patrimonio del Comune. È prevista anche una sanzione pecuniaria per l'inottemperanza."],
["Rifiuti","Rifiuto è ciò di cui il detentore si disfa o ha intenzione o obbligo di disfarsi. Distinguere urbani e speciali, pericolosi e non pericolosi. L'abbandono è vietato (art. 192) e sanzionato (art. 255); la gestione senza autorizzazione è reato (art. 256)."],
["Rumore","Superamento dei limiti di emissione: illecito amministrativo (L. 447/1995). Disturbo del riposo o delle occupazioni di un numero indeterminato di persone: reato (art. 659 c.p.)."],
["Ordinanze sindacali","In caso di emergenze sanitarie o di igiene pubblica a carattere locale il Sindaco adotta ordinanze contingibili e urgenti (art. 50, c. 5 TUEL)."]
],
procedura:[
"Origine: segnalazione, esposto o controllo d'ufficio.",
"Verifica preliminare presso l'ufficio edilizia: esistenza del titolo e degli elaborati.",
"Sopralluogo: verifica del cartello di cantiere, del titolo esibito, della corrispondenza tra opere e progetto; fotografie e misure.",
"Verbale di sopralluogo; se le opere sono prive di titolo, comunicazione a autorità giudiziaria, Regione e dirigente (art. 27, c. 4).",
"Eventuale sequestro penale preventivo o probatorio se ricorre il reato e serve a interrompere l'attività.",
"Il dirigente adotta i provvedimenti: sospensione, ingiunzione a demolire, sanzioni pecuniarie."
],
trappole:[
"Confondere SCIA e CILA o attribuire alla polizia locale il potere di emettere l'ordinanza di demolizione (spetta al dirigente, art. 107 TUEL).",
"Trattare solo il profilo amministrativo dimenticando quello penale (art. 44).",
"Confondere l'illecito amministrativo acustico con il reato dell'art. 659 c.p.",
"Citare l'importo delle sanzioni sui rifiuti senza verificare le modifiche del 2025."
],
flash:[
["Cosa fa la PG in un cantiere senza cartello o senza titolo esibito?","Comunica subito ad autorità giudiziaria, organo regionale competente e dirigente (art. 27, c. 4 DPR 380)."],
["Chi ordina la sospensione dei lavori abusivi?","Il dirigente o responsabile del servizio comunale (art. 27 DPR 380, art. 107 TUEL)."],
["Termine per eseguire l'ingiunzione di demolizione?","90 giorni; poi acquisizione gratuita al patrimonio comunale (art. 31)."],
["Quale norma prevede le sanzioni penali edilizie?","Art. 44 DPR 380/2001."],
["Gli interventi di manutenzione ordinaria richiedono un titolo?","No, sono attività edilizia libera (art. 6)."],
["Dove è previsto il divieto di abbandono dei rifiuti?","Art. 192 D.Lgs. 152/2006 (sanzioni all'art. 255)."],
["Disturbo del riposo delle persone: quale norma?","Art. 659 c.p. (reato)."]
],
quiz:[
["Un ampliamento eseguito senza permesso di costruire comporta:",["Solo una sanzione pecuniaria","Ingiunzione a demolire e reato (art. 44 lett. b)","Solo la comunicazione al proprietario","Nessuna conseguenza se ultimato"],1,"Art. 31 (demolizione) e art. 44 lett. b DPR 380/2001."],
["Se l'ingiunzione di demolizione non viene eseguita entro 90 giorni:",["Si archivia","Il bene è acquisito gratuitamente al patrimonio comunale","Si raddoppia la sanzione","Decide il Prefetto"],1,"Art. 31, c. 3 DPR 380/2001."],
["La manutenzione ordinaria rientra:",["Nell'attività edilizia libera","Nella CILA","Nella SCIA","Nel permesso di costruire"],0,"Art. 6 DPR 380/2001."],
["Chi ha la competenza a irrogare le sanzioni amministrative per l'abusivismo edilizio nel Comune?",["Il Sindaco","Il Consiglio comunale","Il dirigente","Il comandante della polizia locale"],2,"Art. 107 TUEL e art. 27 DPR 380/2001."],
["La gestione di rifiuti senza autorizzazione è:",["Illecito amministrativo","Reato (art. 256 D.Lgs. 152/2006)","Lecita sotto i 100 kg","Competenza esclusiva dell'ASL"],1,"Art. 256 D.Lgs. 152/2006."]
],
esercizi:[
{t:"Cantiere senza titolo",q:"Durante un controllo trovi lavori di ampliamento di un'abitazione senza cartello di cantiere. Il proprietario non esibisce alcun titolo edilizio. Descrivi qualificazione giuridica, attività e atti, competenze e conseguenze.",schema:[

"Verifica presso l'ufficio edilizia dell'esistenza di un titolo.",
"Sopralluogo e verbale con fotografie e misure; identificazione di proprietario, committente, direttore lavori, impresa.",
"Comunicazione immediata ad autorità giudiziaria, Regione e dirigente (art. 27, c. 4).",
"Profilo penale: art. 44 lett. b; eventuale sequestro preventivo del cantiere.",
"Profilo amministrativo: sospensione dei lavori e ingiunzione a demolire del dirigente (artt. 27 e 31); acquisizione in caso di inottemperanza.",
"Possibile richiesta di accertamento di conformità (art. 36) se l'opera è conforme."]},
{t:"Abbandono di rifiuti",q:"Una segnalazione indica sacchi di rifiuti e materiali edili abbandonati ai bordi di una strada comunale. Descrivi come procedi.",schema:[

{
id:"comm", title:"Commercio, pubblici esercizi, attività ricettive e turismo", prio:"alta", level:"ottima conoscenza", weeks:"5",
intro:"Gran parte della normativa è regionale. Lo scritto può chiedere un controllo su un bar, un mercato o una struttura ricettiva: devi sapere quale titolo serve e cosa verificare.",
norme:[
["D.Lgs. 114/1998","Riforma del commercio: esercizi di vicinato, medie e grandi strutture di vendita, commercio su aree pubbliche."],
["L.R. Toscana 62/2018","Codice del commercio della Toscana: sede fissa, aree pubbliche, somministrazione, forme speciali di vendita. ⚠ Verifica il testo vigente."],
["D.Lgs. 59/2010, art. 71","Requisiti morali e professionali per commercio alimentare e somministrazione."],
["D.Lgs. 222/2016","Regimi amministrativi (autorizzazione, SCIA, comunicazione) per le attività."],
["D.P.R. 160/2010","Sportello unico per le attività produttive (SUAP)."],
["L. 287/1991","Disciplina storica dei pubblici esercizi, in parte superata dalla normativa regionale."],
["TULPS, artt. 68–69 e 80","Spettacoli e trattenimenti pubblici; agibilità dei locali di pubblico spettacolo (commissione di vigilanza)."],

["TULPS, art. 109","Obbligo per i gestori di strutture ricettive di comunicare le generalità degli alloggiati all'autorità di PS entro 24 ore (Alloggiati Web)."],
["L.R. Toscana 86/2016","Testo unico del sistema turistico regionale: strutture ricettive e locazioni turistiche. ⚠ Verifica il testo vigente."],

["Reg. CE 852/2004","Igiene degli alimenti (HACCP), competenza dell'ASL."],
["L. 160/2019, c. 816 ss.","Canone unico patrimoniale per l'occupazione di suolo pubblico."],
["Art. 50, c. 7 e 7-bis TUEL","Il Sindaco coordina gli orari degli esercizi e può limitare orari di vendita e somministrazione di alcolici."]
],
concetti:[
["Tipologie di commercio","Sede fissa: esercizi di vicinato, medie e grandi strutture (soglie di superficie stabilite dalla legge e dalla Regione). Aree pubbliche: su posteggio (tipo A) o in forma itinerante (tipo B)."],
["Titoli abilitativi","Le attività si avviano con SCIA, autorizzazione o comunicazione al SUAP, secondo il D.Lgs. 222/2016 e la legge regionale. La polizia locale verifica che il titolo esista e che l'attività lo rispetti."],
["Somministrazione","Vendita per il consumo sul posto con attrezzature. Richiede requisiti morali e professionali (art. 71 D.Lgs. 59/2010) e il rispetto delle norme su orari, igiene, sicurezza, rumore."],
["Alcol e minori","Somministrare alcolici a minori di 18 anni è reato (art. 689 c.p.); la vendita è sanzionata anche in via amministrativa (L. 125/2001). Somministrare a chi è in manifesta ubriachezza è reato (art. 691 c.p.)."],
["Strutture ricettive","Obbligo di comunicare gli alloggiati alla Questura entro 24 ore (art. 109 TULPS) e di esporre il CIN. La disciplina regionale distingue alberghiere, extra-alberghiere, all'aria aperta, locazioni turistiche."],
["Pubblici spettacoli","Licenza o SCIA per trattenimenti e spettacoli (artt. 68–69 TULPS) e verifica di agibilità del locale (art. 80)."],
["Occupazione di suolo pubblico","Serve concessione o autorizzazione; l'occupazione abusiva è sanzionata dal regolamento del canone unico e, sulle strade, dall'art. 20 CdS."]
],
procedura:[
"Verifica preventiva al SUAP: titolo, intestatario, superficie autorizzata, orari, eventuale concessione di suolo pubblico.",
"Controllo nel locale: identificazione del titolare o preposto, esposizione dei prezzi, orari, superficie occupata, rispetto delle prescrizioni.",
"Accertamento delle violazioni amministrative con verbale e contestazione (L. 689/1981).",
"Segnalazione agli uffici competenti (SUAP per i provvedimenti sul titolo, ASL per l'igiene, Questura per i profili di PS).",
"Se emergono reati (alcol a minori, ubriachezza), comunicazione della notizia di reato al PM."
],
trappole:[
"Applicare solo la legge statale dimenticando la legge regionale toscana.",
"Attribuire alla polizia locale la sospensione della licenza: per motivi di ordine pubblico spetta al Questore (art. 100 TULPS); per i titoli comunali al dirigente o al SUAP.",
"Trattare la somministrazione di alcolici a minori come semplice illecito amministrativo.",
"Dimenticare che igiene e HACCP sono competenza dell'ASL."
],
flash:[
["Entro quando vanno comunicati gli alloggiati all'autorità di PS?","Entro 24 ore (art. 109 TULPS)."],
["Quale norma stabilisce i requisiti per la somministrazione?","Art. 71 D.Lgs. 59/2010."],
["Somministrare alcolici a un minore di 18 anni è…","Reato (art. 689 c.p.)."],
["Chi può sospendere una licenza per motivi di ordine pubblico?","Il Questore (art. 100 TULPS)."],
["Quale regolamento disciplina il SUAP?","D.P.R. 160/2010."],
["Commercio itinerante su aree pubbliche: quale tipo?","Tipo B (tipo A è su posteggio)."],
["Cos'è il CIN?","Codice identificativo nazionale delle strutture ricettive e locazioni turistiche."]
],
quiz:[
["Il gestore di un B&B deve comunicare le generalità degli ospiti all'autorità di PS entro:",["12 ore","24 ore","48 ore","5 giorni"],1,"Art. 109 TULPS."],
["La sospensione di una licenza per gravi motivi di ordine pubblico è disposta da:",["Sindaco","Polizia locale","Questore","Prefetto"],2,"Art. 100 TULPS."],
["La somministrazione di alcolici a un sedicenne è:",["Lecita con il consenso dei genitori","Illecito amministrativo lieve","Reato","Competenza esclusiva dell'ASL"],2,"Art. 689 c.p."],
["I requisiti professionali per la somministrazione sono previsti da:",["Art. 71 D.Lgs. 59/2010","Art. 86 TULPS","Art. 7-bis TUEL","D.P.R. 380/2001"],0,"Art. 71 D.Lgs. 59/2010."],
["Il controllo dell'igiene degli alimenti (HACCP) spetta principalmente a:",["Polizia locale","ASL","Questura","Camera di commercio"],1,"Reg. CE 852/2004: competenza sanitaria."]
],
esercizi:[
{t:"Bar fuori orario",q:"Alle 2 di notte un bar resta aperto oltre l'orario consentito, con tavolini su un'area del marciapiede più ampia di quella concessa. Ci sono clienti molto giovani che consumano alcolici e i vicini lamentano rumore. Descrivi come procedi.",schema:[

"Identificazione del titolare o preposto e dei clienti, con particolare attenzione all'età.",
"Violazione dell'orario: verbale secondo regolamento o ordinanza (art. 50 TUEL, legge regionale).",
"Occupazione abusiva di suolo pubblico: verbale (canone unico e art. 20 CdS).",
"Alcol a minori: reato (art. 689 c.p.), notizia di reato; profilo amministrativo (L. 125/2001).",

{t:"Controllo a un mercato",q:"Durante il mercato settimanale noti un venditore senza posteggio assegnato che vende merce in un'area non autorizzata. Descrivi qualificazione, controlli e atti.",schema:[

]
},
{
id:"pen", title:"Diritto penale, procedura penale e polizia giudiziaria", prio:"alta", level:"buona conoscenza", weeks:"6",
intro:"Il bando chiede una buona conoscenza con riferimento all'attività di polizia giudiziaria. Concentrati sulle funzioni della PG, sulla flagranza, sugli atti tipici e sui reati più frequenti in servizio.",
norme:[
["Artt. 39–43 c.p.","Delitti e contravvenzioni; nesso causale; dolo, colpa, preterintenzione."],
["Artt. 50–54 c.p.","Cause di giustificazione: consenso, esercizio di un diritto o adempimento di un dovere, legittima difesa, uso legittimo delle armi, stato di necessità."],
["Artt. 56 e 110 c.p.","Tentativo e concorso di persone nel reato."],
["Artt. 357–358 c.p.","Pubblico ufficiale e incaricato di pubblico servizio."],
["Artt. 314–328 c.p.","Delitti dei pubblici ufficiali: peculato, concussione, corruzione, rifiuto e omissione di atti d'ufficio. L'abuso d'ufficio (art. 323) è stato abrogato dalla L. 114/2024."],
["Artt. 336, 337, 341-bis c.p.","Violenza o minaccia a pubblico ufficiale, resistenza, oltraggio."],
["Artt. 361, 495, 496, 651 c.p.","Omessa denuncia del PU, falsa attestazione sulla propria identità, false dichiarazioni, rifiuto di fornire le proprie generalità."],
["Artt. 581, 582, 610, 612, 612-bis c.p.","Percosse, lesioni, violenza privata, minaccia, atti persecutori."],
["Artt. 624, 624-bis, 625, 628, 640, 635, 648 c.p.","Furto, furto in abitazione e con strappo, aggravanti, rapina, truffa, danneggiamento, ricettazione."],
["Art. 55 c.p.p.","Funzioni della PG: prendere notizia dei reati, impedirne le conseguenze, ricercarne gli autori, assicurare le fonti di prova."],
["Art. 57 c.p.p. e art. 5 L. 65/1986","Ufficiali e agenti di PG: la polizia locale ha la qualità nei limiti del servizio e del territorio."],
["Art. 347 c.p.p.","Comunicazione della notizia di reato al PM senza ritardo."],
["Artt. 348–357 c.p.p.","Assicurazione delle fonti di prova, identificazione, sommarie informazioni, perquisizioni, accertamenti urgenti, sequestro, documentazione."],
["Artt. 380–391 c.p.p.","Arresto obbligatorio e facoltativo in flagranza, stato di flagranza, fermo, doveri della PG, convalida."],
["D.Lgs. 150/2022 (riforma Cartabia)","Estende la procedibilità a querela per alcuni reati (tra cui ipotesi di furto e lesioni). ⚠ Verifica la procedibilità del reato prima di citarla."]
],
concetti:[
["Delitti e contravvenzioni","Si distinguono per la pena: i delitti sono puniti con ergastolo, reclusione e multa; le contravvenzioni con arresto e ammenda. Nei delitti serve di regola il dolo; nelle contravvenzioni basta la colpa."],
["La polizia locale come PG","Ufficiali di PG: comandante e addetti al coordinamento e controllo. Agenti di PG: operatori. La qualità vale solo in servizio e nel territorio di competenza (art. 57 c.p.p., art. 5 L. 65/1986)."],
["Flagranza (art. 382 c.p.p.)","È in flagranza chi viene colto mentre commette il reato oppure, subito dopo, è inseguito dalla PG, dalla persona offesa o da altri, o è sorpreso con cose o tracce da cui appare che ha commesso il reato immediatamente prima (quasi flagranza)."],
["Arresto obbligatorio e facoltativo","Obbligatorio per i reati gravi indicati dall'art. 380 (es. rapina, furto in abitazione e con strappo). Facoltativo nei casi dell'art. 381, valutando gravità del fatto e pericolosità. L'arrestato va messo a disposizione del PM entro 24 ore; la convalida si chiede entro 48 ore."],
["Fermo (art. 384)","Disposto dal PM, o d'iniziativa della PG in casi urgenti, per gravi indizi di un reato grave e pericolo di fuga."],
["Atti tipici della PG","Identificazione (art. 349, con accompagnamento fino a 12 ore, prorogabili a 24), sommarie informazioni dall'indagato (art. 350) e dai testimoni (art. 351), perquisizioni in flagranza (art. 352), accertamenti urgenti (art. 354), sequestro con verbale trasmesso al PM entro 48 ore (art. 355)."],
["Furto e rapina","Il furto è l'impossessamento della cosa altrui sottraendola a chi la detiene. La rapina richiede violenza o minaccia (art. 628): propria se usata per sottrarre, impropria se usata subito dopo per assicurarsi il possesso o l'impunità."],
["Reati contro i pubblici ufficiali","Violenza o minaccia per costringere il PU a compiere un atto (336), resistenza mentre compie un atto d'ufficio (337), oltraggio in luogo pubblico e in presenza di più persone (341-bis)."]
],
procedura:[
"Prendi notizia del reato e intervieni per impedirne le conseguenze.",
"Identifica gli autori e le persone informate sui fatti.",
"Assicura le fonti di prova: rilievi, sequestro del corpo del reato, documentazione dei luoghi.",

norme:[

["Art. 117, c. 2 lett. h Cost.","Ordine pubblico e sicurezza sono competenza esclusiva dello Stato, esclusa la polizia amministrativa locale."],
["D.L. 14/2017 (L. 48/2017)","Sicurezza delle città: art. 4 sicurezza urbana; art. 9 ordine di allontanamento (48 ore); art. 10 divieto di accesso del Questore (DASPO urbano)."],

["L. 110/1975, art. 4","Porto di armi od oggetti atti ad offendere senza giustificato motivo."],
["D.P.R. 309/1990","Stupefacenti: art. 73 produzione, traffico e detenzione illecita (c. 5 lieve entità); art. 75 uso personale, sanzioni amministrative del Prefetto."],

["D.Lgs. 286/1998 (TU immigrazione)","Art. 6 obbligo di esibire i documenti a richiesta; art. 7 comunicazione entro 48 ore di chi ospita o cede un immobile a uno straniero; art. 10-bis ingresso e soggiorno illegale; art. 12 favoreggiamento; art. 13 espulsione."],
["L. 833/1978, artt. 33–35","Accertamenti e trattamenti sanitari obbligatori (ASO e TSO)."],
["D.L. 48/2025 (L. 80/2025)","Decreto sicurezza 2025: nuove norme penali e tutele per le forze di polizia. ⚠ Verifica le parti di interesse per la polizia locale."]

concetti:[
["Funzioni della polizia locale","Funzioni di polizia amministrativa locale, di polizia stradale, di polizia giudiziaria e ausiliarie di pubblica sicurezza. Il Sindaco impartisce le direttive e vigila; il comandante risponde al Sindaco. Collabora con le forze di polizia dello Stato su disposizione del Sindaco, quando c'è una richiesta motivata."],
["Agente di pubblica sicurezza","La qualità è conferita dal Prefetto, su richiesta del Sindaco, a chi ha i requisiti dell'art. 5 L. 65/1986: godimento dei diritti civili e politici, nessuna condanna a pena detentiva per delitto non colposo né misure di prevenzione, nessuna espulsione dalle Forze Armate o destituzione dai pubblici uffici. Sono gli stessi requisiti indicati nel bando."],
["Sicurezza urbana","Bene pubblico che riguarda la vivibilità e il decoro delle città (D.L. 14/2017). Ordine di allontanamento: disposto dall'organo accertatore, dura 48 ore. In caso di reiterazione il Questore può disporre il divieto di accesso (DASPO urbano)."],
["Ordinanze sindacali","Art. 50: il Sindaco come capo dell'amministrazione (emergenze sanitarie e di igiene pubblica locali, orari). Art. 54: il Sindaco come ufficiale del Governo, per prevenire ed eliminare gravi pericoli per l'incolumità pubblica e la sicurezza urbana, con comunicazione preventiva al Prefetto."],
["Stupefacenti","La detenzione per uso personale è illecito amministrativo (art. 75, segnalazione al Prefetto). Produzione, cessione e detenzione non per uso personale sono reato (art. 73)."],
["Immigrazione","Lo straniero deve esibire passaporto e permesso di soggiorno a richiesta (art. 6). Chi ospita o dà in uso un immobile a uno straniero lo comunica all'autorità di PS entro 48 ore (art. 7)."],
["TSO","Disposto con ordinanza del Sindaco, come autorità sanitaria, su proposta motivata di un medico. Se comporta degenza ospedaliera serve la convalida di un medico della struttura pubblica. Il provvedimento va notificato entro 48 ore al giudice tutelare, che convalida entro le successive 48 ore. La polizia locale assiste il personale sanitario nell'esecuzione."]
],
procedura:[
"Individua la competenza: polizia locale, forze di polizia statali, autorità sanitaria.",
"Verifica il presupposto normativo dell'intervento (ordinanza, legge, richiesta motivata).",
"Per l'ordine di allontanamento: accerta la violazione nelle aree indicate, redigi il verbale, trasmetti al Questore.",
"Per il TSO: verifica l'ordinanza del Sindaco e le proposte mediche, assisti il personale sanitario, documenta l'intervento.",
"Per armi, stupefacenti e immigrazione: identifica, sequestra se necessario, segnala o comunica la notizia di reato."
],
trappole:[

"Attribuire al Sindaco il DASPO urbano: lo dispone il Questore.",

"Considerare reato la detenzione per uso personale di stupefacenti.",
"Descrivere il TSO senza le garanzie: proposta e convalida mediche, ordinanza, giudice tutelare."
],

norme:[

concetti:[

["Competenze degli organi","Consiglio: atti fondamentali tassativi (art. 42). Giunta: competenza residuale (art. 48). Sindaco: rappresentanza, ordinanze, nomine (art. 50); ufficiale del Governo (art. 54)."],

["Anticorruzione","Sistema di prevenzione: ANAC definisce il PNA; ogni ente nomina un RPCT e inserisce le misure nel PIAO. Strumenti: rotazione, astensione, pantouflage, whistleblowing, trasparenza."],
["Trasparenza","Pubblicazione obbligatoria di dati e atti nella sezione Amministrazione trasparente. Accesso civico semplice (dati che dovevano essere pubblicati) e generalizzato (tutti i dati, con i limiti dell'art. 5-bis)."]
],

}

/* ============ MODULI ============ */
function openMod(id){state.tab="mods";state.mod=id;state.modSub="norme";render();window.scrollTo(0,0)}
function mods(){
  if(state.mod)return modView();
  $("#app").innerHTML=`<h2>Moduli</h2><p class="mut">Ordinati per priorità nel bando. Clicca un modulo per studiarlo.</p><div class="modlist">${MODULES.map((m,i)=>`
  <div class="card" onclick="openMod('${m.id}')"><div class="row" style="justify-content:space-between"><b>${i+1}. ${m.title}</b><span class="pill ${m.prio}">${m.level}</span></div>
  <div class="mut" style="margin-top:4px">Settimana ${m.weeks} · ${m.norme.length} riferimenti · ${m.flash.length} flashcard · ${m.quiz.length} quiz · ${m.esercizi.length} esercizi</div>
  <div class="bar"><i style="width:${modPct(m.id)}%"></i></div></div>`).join("")}</div>`;
}
function setProg(id,k,v){const p=progress();p[id]=p[id]||{};p[id][k]=v;S.set("prog",p)}
function modView(){
  const m=MODULES.find(x=>x.id===state.mod),i=MODULES.indexOf(m),p=progress()[m.id]||{};
  const subs=[["norme","Norme"],["concetti","Concetti chiave"],["procedura","Procedura"],["trappole","Errori da evitare"],["esercizi","Esercizi"]];
  let body="";
  if(state.modSub==="norme")body=`<table><tr><th>Riferimento</th><th>Contenuto</th></tr>${m.norme.map(n=>`<tr><td class="ref">${esc(n[0])}</td><td>${esc(n[1])}</td></tr>`).join("")}</table>`;
  if(state.modSub==="concetti")body=m.concetti.map(c=>`<div class="concept"><b>${esc(c[0])}</b>${esc(c[1])}</div>`).join("");
  if(state.modSub==="procedura")body=`<ol>${m.procedura.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  if(state.modSub==="trappole")body=`<ul>${m.trappole.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(state.modSub==="esercizi")body=m.esercizi.map((e,j)=>`<div class="card"><b>${esc(e.t)}</b><p>${esc(e.q)}</p><button class="btn" onclick="startWrite('${m.id}',${j})">Scrivi la risposta a tempo</button></div>`).join("");
  $("#app").innerHTML=`<button class="btn sec" onclick="state.mod=null;render()">← Tutti i moduli</button>
  <div class="card" style="margin-top:12px"><span class="pill ${m.prio}">${m.level}</span><span class="pill">Settimana ${m.weeks}</span>
  <h2>${i+1}. ${m.title}</h2><p>${esc(m.intro)}</p>
  <div class="chk"><label><input type="checkbox" ${p.s?"checked":""} onchange="setProg('${m.id}','s',this.checked)"> Studiato</label>
  <label><input type="checkbox" ${p.e?"checked":""} onchange="setProg('${m.id}','e',this.checked)"> Esercizio scritto fatto</label>
  <label><input type="checkbox" ${p.r?"checked":""} onchange="setProg('${m.id}','r',this.checked)"> Ripassato</label></div>
  <div class="sub">${subs.map(([k,l])=>`<button class="${state.modSub===k?"on":""}" onclick="state.modSub='${k}';render()">${l}</button>`).join("")}</div></div>
  <div class="card">${body}</div>
  <div class="row"><button class="btn sec" onclick="state.fcMod='${m.id}';state.fcIdx=0;state.fcBack=false;go('fc')">Flashcard del modulo</button>
  <button class="btn sec" onclick="startQuiz('${m.id}')">Quiz del modulo</button></div>`;
}

/* ============ FLASHCARD ============ */
function fcDeck(){let d=[];MODULES.forEach(m=>{if(state.fcMod==="all"||state.fcMod===m.id)m.flash.forEach((f,i)=>d.push({k:m.id+"_"+i,q:f[0],a:f[1],m:m.title}))});if(state.fcOnly){const k=known();d=d.filter(x=>!k[x.k])}return d}
function fc(){
  const d=fcDeck();if(state.fcIdx>=d.length)state.fcIdx=0;const c=d[state.fcIdx];
  $("#app").innerHTML=`<h2>Flashcard</h2><div class="row">
  <select onchange="state.fcMod=this.value;state.fcIdx=0;state.fcBack=false;render()"><option value="all">Tutti i moduli</option>${MODULES.map((m,i)=>`<option value="${m.id}" ${state.fcMod===m.id?"selected":""}>${i+1}. ${m.title}</option>`).join("")}</select>
  <label class="small"><input type="checkbox" ${state.fcOnly?"checked":""} onchange="state.fcOnly=this.checked;state.fcIdx=0;render()"> Solo quelle da ripassare</label>
  <button class="btn sec" onclick="shuffleFc()">Mescola</button></div>
  ${c?`<p class="mut">${state.fcIdx+1} di ${d.length} · ${esc(c.m)}</p>
  <div class="card flash ${state.fcBack?"back":""}" onclick="state.fcBack=!state.fcBack;render()">${esc(state.fcBack?c.a:c.q)}</div>
  <p class="mut" style="text-align:center">Tocca la carta per girarla</p>
  <div class="row" style="justify-content:center"><button class="btn ko" onclick="mark('${c.k}',false)">Da ripassare</button><button class="btn ok" onclick="mark('${c.k}',true)">La so</button></div>`
  :`<div class="card">Nessuna carta da ripassare in questa selezione. Ottimo lavoro.</div>`}`;
}
let fcOrder=null;
function shuffleFc(){const k=known();state.fcIdx=Math.floor(Math.random()*Math.max(1,fcDeck().length));state.fcBack=false;render()}
function mark(k,ok){const kn=known();if(ok)kn[k]=1;else delete kn[k];S.set("known",kn);state.fcBack=false;if(!(ok&&state.fcOnly))state.fcIdx++;render()}

/* ============ QUIZ ============ */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(id){
  let pool=[];
  if(id==="logic")pool=LOGIC.map(q=>({q,m:"Logica"}));
  else MODULES.forEach(m=>{if(id==="mix"||id===m.id)m.quiz.forEach(q=>pool.push({q,m:m.title}))});
  state.quiz={id,items:shuffle(pool).slice(0,id==="mix"?15:10),i:0,ans:null,ok:0};state.tab="quiz";render();window.scrollTo(0,0)}
function quiz(){
  const Q=state.quiz;
  if(!Q){$("#app").innerHTML=`<h2>Quiz</h2><p class="mut">Utili per fissare termini, competenze e articoli, e per la preselezione. La prova scritta resta a risposta aperta.</p>
  <div class="grid"><div class="card"><b>Quiz misto</b><p class="mut">15 domande da tutti i moduli</p><button class="btn" onclick="startQuiz('mix')">Inizia</button></div>
  <div class="card"><b>Logica (preselezione)</b><p class="mut">Serie, sillogismi, calcolo, negazioni</p><button class="btn" onclick="startQuiz('logic')">Inizia</button></div></div>
  <h3>Per modulo</h3>${MODULES.map((m,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${m.title}</span><span class="row"><span class="mut">${scores()[m.id]!=null?"Migliore: "+scores()[m.id]+"%":""}</span><button class="btn sec" onclick="startQuiz('${m.id}')">Inizia</button></span></div>`).join("")}`;return}
  if(Q.i>=Q.items.length){const pct=Math.round(Q.ok/Q.items.length*100);
    if(!["mix","logic"].includes(Q.id)){const s=scores();s[Q.id]=Math.max(s[Q.id]||0,pct);S.set("scores",s)}
    $("#app").innerHTML=`<div class="card"><h2>Risultato: ${Q.ok}/${Q.items.length} (${pct}%)</h2><p>${pct>=80?"Ottimo. Passa agli esercizi scritti del modulo.":pct>=60?"Buona base: ripassa le flashcard e riprova.":"Torna sulla scheda del modulo e sugli articoli citati, poi riprova."}</p>
    <div class="row"><button class="btn" onclick="startQuiz('${Q.id}')">Riprova</button><button class="btn sec" onclick="state.quiz=null;render()">Tutti i quiz</button></div></div>`;return}
  const it=Q.items[Q.i],[q,o,a,e]=it.q;
  $("#app").innerHTML=`<p class="mut">Domanda ${Q.i+1} di ${Q.items.length} · ${esc(it.m)} · corrette ${Q.ok}</p>
  <div class="card"><b style="font-size:17px">${esc(q)}</b>
  ${o.map((x,j)=>`<button class="opt ${Q.ans!==null?(j===a?"ok":j===Q.ans?"ko":""):""}" ${Q.ans!==null?"disabled":""} onclick="answer(${j})">${esc(x)}</button>`).join("")}
  ${Q.ans!==null?`<div class="expl">${Q.ans===a?"✓ Corretto. ":"✗ Sbagliato. "}${esc(e)}</div><div style="margin-top:12px"><button class="btn" onclick="state.quiz.i++;state.quiz.ans=null;render()">Avanti</button></div>`:""}</div>
  <button class="btn sec" onclick="state.quiz=null;render()">Esci</button>`;
}
function answer(j){const Q=state.quiz;Q.ans=j;if(j===Q.items[Q.i].q[2])Q.ok++;render()}

/* ============ PROVA SCRITTA ============ */
let tId=null;
function stopTimer(){if(tId){clearInterval(tId);tId=null}}
function allEx(){const r=[];MODULES.forEach(m=>m.esercizi.forEach((e,j)=>r.push({m,e,j})));return r}
function startWrite(mid,j){const m=MODULES.find(x=>x.id===mid);state.write={list:[{m,e:m.esercizi[j],j}],mins:25,sim:false};state.tab="write";stopTimer();render();window.scrollTo(0,0)}
function startSim(){state.write={list:shuffle(allEx()).slice(0,3),mins:90,sim:true};state.tab="write";stopTimer();render();window.scrollTo(0,0)}
function write(){
  const W=state.write;
  if(!W){$("#app").innerHTML=`<h2>Prova scritta</h2>
  <div class="card"><b>Simulazione completa</b><p class="mut">3 quesiti estratti a caso da tutti i moduli, 90 minuti. Ideale nelle settimane 8–9.</p><button class="btn" onclick="startSim()">Avvia simulazione</button></div>
  <div class="card"><b>Come allenarsi</b><ul><li>Rispetta il tempo: circa 25 minuti a quesito.</li><li>Scrivi 15–25 righe: il bando fissa una lunghezza massima, quindi abituati a essere sintetico.</li><li>Dopo il tempo, apri lo schema e spunta i punti che hai trattato. È un'autovalutazione, non il voto della commissione.</li><li>Le bozze restano salvate in questo browser.</li></ul></div>
  <h3>Esercizi singoli</h3>${allEx().map(x=>`<div class="card row" style="justify-content:space-between"><span><b>${esc(x.e.t)}</b><br><span class="mut">${esc(x.m.title)}</span></span><button class="btn sec" onclick="startWrite('${x.m.id}',${x.j})">Scrivi</button></div>`).join("")}`;return}
  const left=S.get("tleft_"+(W.sim?"sim":W.list[0].m.id+W.list[0].j),W.mins*60);
  $("#app").innerHTML=`<button class="btn sec" onclick="stopTimer();state.write=null;render()">← Elenco esercizi</button>
  <div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><div><div class="mut">${W.sim?"Simulazione · 3 quesiti":"Esercizio a tempo"}</div><div class="timer" id="tm">${fmt(left)}</div></div>
  <div class="row"><button class="btn" id="tb" onclick="toggleTimer()">Avvia timer</button><button class="btn sec" onclick="resetTimer()">Azzera</button></div></div></div>
  ${W.list.map((x,n)=>{const key="draft_"+x.m.id+"_"+x.j;const d=S.get(key,"");return `<div class="card"><span class="pill">${esc(x.m.title)}</span><h3 style="text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">${W.sim?"Quesito "+(n+1)+": ":""}${esc(x.e.t)}</h3><p>${esc(x.e.q)}</p>
  <textarea placeholder="Scrivi qui la tua risposta…" oninput="S.set('${key}',this.value);cnt(this,${n})">${esc(d)}</textarea>
  <div class="mut" id="c${n}">${count(d)}</div>
  <div style="margin-top:10px"><button class="btn sec" onclick="document.getElementById('s${n}').classList.toggle('hidden')">Mostra / nascondi schema di correzione</button></div>
  <div id="s${n}" class="hidden" style="margin-top:10px"><p class="mut">Spunta i punti che hai trattato in modo corretto:</p>${x.e.schema.map((p,k)=>`<label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" onchange="selfScore(${n},${x.e.schema.length})" class="sc${n}"> <span>${esc(p)}</span></label>`).join("")}<div class="expl" id="v${n}">Punti trattati: 0/${x.e.schema.length}</div></div></div>`}).join("")}`;
}
function count(t){const w=t.trim()?t.trim().split(/\s+/).length:0;return `${w} parole · circa ${Math.ceil(t.length/80)} righe`}
function cnt(el,n){document.getElementById("c"+n).textContent=count(el.value)}
function selfScore(n,tot){const c=document.querySelectorAll(".sc"+n+":checked").length;const v=Math.round(c/tot*30);document.getElementById("v"+n).innerHTML=`Punti trattati: ${c}/${tot} · stima indicativa ≈ <b>${v}/30</b> ${v>=21?"(sopra la soglia di 21)":"(sotto la soglia di 21)"}`}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tkey(){const W=state.write;return "tleft_"+(W.sim?"sim":W.list[0].m.id+W.list[0].j)}
function toggleTimer(){
  if(tId){stopTimer();$("#tb").textContent="Riprendi";return}
  $("#tb").textContent="Pausa";
  tId=setInterval(()=>{let l=S.get(tkey(),state.write.mins*60)-1;S.set(tkey(),l);const el=$("#tm");if(el)el.textContent=fmt(l);if(l<=0){stopTimer();if(el)el.textContent="Tempo scaduto";const b=$("#tb");if(b)b.textContent="Avvia timer"}},1000)}
function resetTimer(){stopTimer();S.set(tkey(),state.write.mins*60);render()}

/* ============ ORALE ============ */
function oral(){
  $("#app").innerHTML=`<h2>Prova orale</h2>
  <div class="card"><p>Il colloquio verte sulle materie dello scritto e sulle competenze attitudinali. Inglese e informatica valgono solo come <b>idoneità</b>, ma se non li superi sei escluso.</p>
  <h3>Come prepararti</h3><ul>
  <li>Allenati a esporre ad alta voce ogni esercizio scritto in 3–4 minuti.</li>
  <li>Prepara una risposta su motivazione, gestione dello stress e dei conflitti, lavoro in squadra: sono le competenze trasversali elencate nel bando.</li>
  <li>Informatica: posta elettronica e PEC, firma digitale, SPID e CIE, documenti condivisi, foglio di calcolo di base, sicurezza informatica (password, phishing), banche dati della polizia locale.</li>
  <li>Inglese: frasi operative semplici e una breve presentazione di te.</li></ul></div>
  <div class="card"><h3>Frasi utili in inglese</h3><table class="en">${EN.map(e=>`<tr><td>${esc(e[0])}</td><td class="mut">${esc(e[1])}</td></tr>`).join("")}</table>
  <p class="mut">Esercizio: leggi la frase in italiano, coprendo l'inglese, e prova a dirla a voce.</p></div>
  <div class="card"><h3>Presentazione di te (modello)</h3><p><i>My name is … I live in … I studied … and I work as … I want to work in the local police because I like working with people and I want to help my community. I am a team player and I can stay calm in stressful situations.</i></p></div>`;
}

render();
</script>
</body>
</html>
